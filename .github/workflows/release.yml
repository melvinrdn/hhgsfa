name: Release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hhgsfa
    permissions:
      id-token: write  # PyPI trusted publishing, no token stored
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Tag matches the version in pyproject.toml
        run: test "${GITHUB_REF_NAME}" = "v$(uv version --short)"
      - run: uv build
      - run: uv publish
