name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]  # oldest and newest supported
        backend: [numpy, numba]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: uv run --group dev ${{ matrix.backend == 'numba' && '--extra numba' || '' }} pytest
